<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Locations — ServiceBook Admin</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .loc-type { padding:3px 10px; border-radius:20px; font-size:0.75rem; font-weight:600; white-space:nowrap; }
    .loc-PROVINCE { background:#dbeafe; color:#1e40af; }
    .loc-DISTRICT { background:#dcfce7; color:#166534; }
    .loc-SECTOR   { background:#fef3c7; color:#92400e; }
    .loc-CELL     { background:#ede9fe; color:#5b21b6; }
    .loc-VILLAGE  { background:#fce7f3; color:#9d174d; }

    .breadcrumb { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:0.875rem; color:var(--text-light); margin-bottom:16px; }
    .bc-link    { cursor:pointer; color:var(--primary); font-weight:500; }
    .bc-link:hover { text-decoration:underline; }
    .bc-sep     { color:#cbd5e1; }
    .bc-current { font-weight:700; color:var(--text); }

    .level-strip { display:flex; margin-bottom:20px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
    .level-step  { flex:1; padding:8px 4px; text-align:center; font-size:0.75rem; font-weight:600; background:#f8fafc; color:var(--text-light); border-right:1px solid var(--border); }
    .level-step:last-child { border-right:none; }
    .level-step.done   { background:#dbeafe; color:#1e40af; }
    .level-step.active { background:var(--primary); color:#fff; }

    .row-actions { display:flex; gap:4px; flex-wrap:wrap; }
    .btn-sub     { background:#7c3aed; color:#fff; }
    .btn-sub:hover { background:#6d28d9; }
    .drill-link  { color:var(--primary); font-weight:600; text-decoration:none; }
    .drill-link:hover { text-decoration:underline; }

    .loc-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px; }
    .loc-stat  { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px; text-align:center; }
    .loc-stat .num { font-size:1.4rem; font-weight:800; }
    .loc-stat .lbl { font-size:0.75rem; color:var(--text-light); margin-top:2px; }
    .loc-stat.s-province .num { color:#1e40af; }
    .loc-stat.s-district .num { color:#166534; }
    .loc-stat.s-sector   .num { color:#92400e; }
    .loc-stat.s-cell     .num { color:#5b21b6; }
    .loc-stat.s-village  .num { color:#9d174d; }

    /* cascade section inside modal */
    .cascade-box { background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
    .cascade-box .box-title { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-light); margin-bottom:12px; }
    .cascade-step { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .cascade-step:last-child { margin-bottom:0; }
    .cascade-step .step-label { width:80px; flex-shrink:0; }
    .cascade-step select { flex:1; }
    .cascade-step select:disabled { opacity:.5; cursor:not-allowed; }

    .new-box { background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:16px; }
    .new-box .box-title { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#1e40af; margin-bottom:12px; }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <div class="topbar">
    <h1>Locations</h1>
    <div class="topbar-right" id="topbar-user">
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Location</button>
    </div>
  </div>

  <div class="content">
    <div id="alert" class="alert"></div>

    <!-- Stats -->
    <div class="loc-stats">
      <div class="loc-stat s-province"><div class="num" id="cnt-province">—</div><div class="lbl">Provinces</div></div>
      <div class="loc-stat s-district"><div class="num" id="cnt-district">—</div><div class="lbl">Districts</div></div>
      <div class="loc-stat s-sector">  <div class="num" id="cnt-sector">—</div>  <div class="lbl">Sectors</div></div>
      <div class="loc-stat s-cell">    <div class="num" id="cnt-cell">—</div>    <div class="lbl">Cells</div></div>
      <div class="loc-stat s-village"> <div class="num" id="cnt-village">—</div> <div class="lbl">Villages</div></div>
    </div>

    <!-- Level strip -->
    <div class="level-strip">
      <div class="level-step active" id="step-0">🗺️ Province</div>
      <div class="level-step"        id="step-1">🏙️ District</div>
      <div class="level-step"        id="step-2">🏘️ Sector</div>
      <div class="level-step"        id="step-3">🏠 Cell</div>
      <div class="level-step"        id="step-4">🌿 Village</div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- Search -->
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search in current level…" oninput="filterTable()"/>
      <button class="btn btn-outline" onclick="loadProvinces()">🗺️ Back to Provinces</button>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="card-header">
        <h3 id="table-title">All Provinces</h3>
        <span id="total-badge" class="badge">0</span>
      </div>
      <div class="card-body">
        <div id="table-container"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>
  </div>
</main>

<!-- ══════════════════════════════════════════════════════════════════════════
     ADD MODAL  —  cascade Province → District → Sector → Cell → Village
     ══════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h3>Add Location</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">

      <!-- Step 1 – choose type to add -->
      <div class="form-group">
        <label>What do you want to add?</label>
        <select class="form-control" id="f-type" onchange="onTypeChange()">
          <option value="PROVINCE">🗺️  Province</option>
          <option value="DISTRICT">🏙️  District  (needs a Province)</option>
          <option value="SECTOR">🏘️  Sector    (needs a District)</option>
          <option value="CELL">🏠  Cell      (needs a Sector)</option>
          <option value="VILLAGE">🌿  Village   (needs a Cell)</option>
        </select>
      </div>

      <!-- Step 2 – cascade parent selectors (shown/hidden by type) -->
      <div class="cascade-box" id="cascade-box" style="display:none;">
        <div class="box-title">📍 Select parent location</div>

        <!-- Province row -->
        <div class="cascade-step" id="cs-province" style="display:none;">
          <span class="step-label"><span class="loc-type loc-PROVINCE">PROVINCE</span></span>
          <select class="form-control" id="c-province" onchange="onCProvince()">
            <option value="">— Select Province —</option>
          </select>
        </div>

        <!-- District row -->
        <div class="cascade-step" id="cs-district" style="display:none;">
          <span class="step-label"><span class="loc-type loc-DISTRICT">DISTRICT</span></span>
          <select class="form-control" id="c-district" onchange="onCDistrict()" disabled>
            <option value="">— Select Province first —</option>
          </select>
        </div>

        <!-- Sector row -->
        <div class="cascade-step" id="cs-sector" style="display:none;">
          <span class="step-label"><span class="loc-type loc-SECTOR">SECTOR</span></span>
          <select class="form-control" id="c-sector" onchange="onCSector()" disabled>
            <option value="">— Select District first —</option>
          </select>
        </div>

        <!-- Cell row -->
        <div class="cascade-step" id="cs-cell" style="display:none;">
          <span class="step-label"><span class="loc-type loc-CELL">CELL</span></span>
          <select class="form-control" id="c-cell" onchange="onCCell()" disabled>
            <option value="">— Select Sector first —</option>
          </select>
        </div>
      </div>

      <!-- Step 3 – new location details -->
      <div class="new-box">
        <div class="box-title">✏️ New location details</div>
        <div class="form-row">
          <div class="form-group" style="margin-bottom:0;">
            <label>Name *</label>
            <input class="form-control" id="f-name" placeholder="e.g. Gasabo"/>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Code <small style="color:var(--text-light);">(optional)</small></label>
            <input class="form-control" id="f-code" placeholder="e.g. KGL-GSB"/>
          </div>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary"   onclick="saveLocation()">💾 Save</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════
     EDIT MODAL
     ══════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h3 id="edit-title">Edit Location</h3>
      <button class="modal-close" onclick="closeEditModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Name *</label>
          <input class="form-control" id="e-name"/>
        </div>
        <div class="form-group">
          <label>Code</label>
          <input class="form-control" id="e-code"/>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary"   onclick="saveEdit()">💾 Save Changes</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
requireAuth(true);
buildSidebar('locations');

// ── state ──────────────────────────────────────────────────────────────────
let allLocations    = [];
let breadcrumbStack = [];
let editingId       = null;

const CHILD_TYPE  = { PROVINCE:'DISTRICT', DISTRICT:'SECTOR', SECTOR:'CELL', CELL:'VILLAGE', VILLAGE:null };
const LEVEL_INDEX = { PROVINCE:0, DISTRICT:1, SECTOR:2, CELL:3, VILLAGE:4 };

// ── boot ───────────────────────────────────────────────────────────────────
async function init() {
  await loadStats();
  await loadProvinces();
}

// ── stats ──────────────────────────────────────────────────────────────────
async function loadStats() {
  const res = await apiFetch('/locations');
  if (!res.ok) return;
  const all = res.data || [];
  ['PROVINCE','DISTRICT','SECTOR','CELL','VILLAGE'].forEach(t =>
    document.getElementById('cnt-' + t.toLowerCase()).textContent =
      all.filter(l => l.type === t).length
  );
}

// ── provinces ──────────────────────────────────────────────────────────────
async function loadProvinces() {
  breadcrumbStack = [];
  updateBreadcrumb();
  updateLevelStrip(-1);
  document.getElementById('table-title').textContent = 'All Provinces';
  const res = await apiFetch('/locations/provinces');
  if (!res.ok) { showError(); return; }
  allLocations = res.data || [];
  document.getElementById('total-badge').textContent = allLocations.length;
  renderTable(allLocations, 'PROVINCE');
}

// ── drill ──────────────────────────────────────────────────────────────────
async function drillInto(parentId, parentName, parentType) {
  breadcrumbStack.push({ id: parentId, name: parentName, type: parentType });
  updateBreadcrumb();
  updateLevelStrip(LEVEL_INDEX[parentType]);
  const childType = CHILD_TYPE[parentType];
  document.getElementById('table-title').textContent =
    parentName + '  ›  ' + (childType ? childType + 'S' : 'Sub-locations');
  const res = await apiFetch('/locations/byParent/' + parentId);
  if (!res.ok) { showError(); return; }
  allLocations = res.data || [];
  document.getElementById('total-badge').textContent = allLocations.length;
  renderTable(allLocations, childType || 'VILLAGE');
}

// ── breadcrumb ─────────────────────────────────────────────────────────────
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!breadcrumbStack.length) { bc.innerHTML = ''; return; }
  let html = '<span class="bc-link" onclick="loadProvinces()">🗺️ Provinces</span>';
  breadcrumbStack.forEach((item, i) => {
    html += '<span class="bc-sep">›</span>';
    if (i < breadcrumbStack.length - 1)
      html += '<span class="bc-link" onclick="navTo(' + i + ')">' + item.name + '</span>';
    else
      html += '<span class="bc-current">' + item.name + '</span>';
  });
  bc.innerHTML = html;
}

async function navTo(index) {
  const item = breadcrumbStack[index];
  breadcrumbStack = breadcrumbStack.slice(0, index);
  await drillInto(item.id, item.name, item.type);
}

// ── level strip ────────────────────────────────────────────────────────────
function updateLevelStrip(activeIndex) {
  for (let i = 0; i <= 4; i++) {
    const el = document.getElementById('step-' + i);
    el.className = 'level-step' +
      (i < activeIndex + 1 ? ' done'   : '') +
      (i === activeIndex + 1 ? ' active' : '');
  }
}

// ── render table ───────────────────────────────────────────────────────────
function renderTable(locs, currentType) {
  if (!locs.length) {
    document.getElementById('table-container').innerHTML =
      '<div class="empty-state"><div class="empty-icon">📍</div>' +
      '<p>No ' + (currentType || 'location').toLowerCase() + 's here yet.</p>' +
      '<button class="btn btn-primary" style="margin-top:12px;" onclick="openAddModal()">+ Add Location</button></div>';
    return;
  }
  const canDrill = currentType !== 'VILLAGE';
  const childType = CHILD_TYPE[currentType];
  const rows = locs.map(l => {
    const safeName = l.name.replace(/'/g, "\\'");
    return '<tr>' +
      '<td><strong>#' + l.id + '</strong></td>' +
      '<td>' + (canDrill
        ? '<a class="drill-link" href="#" onclick="drillInto(' + l.id + ',\'' + safeName + '\',\'' + l.type + '\');return false;">' + l.name + '</a>'
        : '<strong>' + l.name + '</strong>') + '</td>' +
      '<td>' + (l.code || '—') + '</td>' +
      '<td><span class="loc-type loc-' + l.type + '">' + l.type + '</span></td>' +
      '<td>' + (l.parent ? l.parent.name : '—') + '</td>' +
      '<td><div class="row-actions">' +
        (canDrill
          ? '<button class="btn btn-sub btn-sm" onclick="drillInto(' + l.id + ',\'' + safeName + '\',\'' + l.type + '\')" title="View ' + childType + 's">📂 ' + childType + 's</button>'
          : '') +
        '<button class="btn btn-warning btn-sm" onclick="openEditModal(' + l.id + ',\'' + safeName + '\',\'' + (l.code || '') + '\',\'' + l.type + '\')">✏️ Edit</button>' +
        '<button class="btn btn-danger btn-sm"  onclick="deleteLocation(' + l.id + ',\'' + safeName + '\',\'' + l.type + '\')">🗑️ Delete</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
  document.getElementById('table-container').innerHTML =
    '<table><thead><tr><th>ID</th><th>Name</th><th>Code</th><th>Type</th><th>Parent</th><th>Actions</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>';
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allLocations.filter(l =>
    l.name.toLowerCase().includes(q) || (l.code || '').toLowerCase().includes(q));
  renderTable(filtered, allLocations[0]?.type || 'PROVINCE');
}

function showError() {
  document.getElementById('table-container').innerHTML =
    '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load locations</p></div>';
}

// ══════════════════════════════════════════════════════════════════════════
//  ADD MODAL — cascade logic
// ══════════════════════════════════════════════════════════════════════════

async function openAddModal() {
  // reset fields
  document.getElementById('f-name').value = '';
  document.getElementById('f-code').value = '';
  document.getElementById('f-type').value = 'PROVINCE';

  // reset cascade selects
  ['province','district','sector','cell'].forEach(l => {
    const sel = document.getElementById('c-' + l);
    sel.innerHTML = '<option value="">— Select ' + l.charAt(0).toUpperCase() + l.slice(1) + ' —</option>';
    sel.disabled = true;
  });

  // load provinces into first dropdown
  const res = await apiFetch('/locations/provinces');
  if (res.ok) {
    const sel = document.getElementById('c-province');
    sel.innerHTML = '<option value="">— Select Province —</option>' +
      (res.data || []).map(l => '<option value="' + l.id + '">' + l.name + '</option>').join('');
  }

  onTypeChange(); // show/hide correct rows
  document.getElementById('modal').classList.add('open');
}

// Show/hide cascade rows based on selected type
function onTypeChange() {
  const type = document.getElementById('f-type').value;
  const needs = { PROVINCE:[], DISTRICT:['province'], SECTOR:['province','district'],
                  CELL:['province','district','sector'], VILLAGE:['province','district','sector','cell'] };
  const required = needs[type] || [];

  // show cascade box only if parent needed
  document.getElementById('cascade-box').style.display = required.length ? 'block' : 'none';

  // show/hide each row
  ['province','district','sector','cell'].forEach(l => {
    document.getElementById('cs-' + l).style.display = required.includes(l) ? 'flex' : 'none';
  });

  // reset selects below province when type changes
  ['district','sector','cell'].forEach(l => {
    const sel = document.getElementById('c-' + l);
    sel.innerHTML = '<option value="">— Select ' + l.charAt(0).toUpperCase() + l.slice(1) + ' first —</option>';
    sel.disabled = true;
  });
}

// Province selected → load districts
async function onCProvince() {
  const id = document.getElementById('c-province').value;
  // reset downstream
  ['district','sector','cell'].forEach(l => {
    const sel = document.getElementById('c-' + l);
    sel.innerHTML = '<option value="">— Select ' + l.charAt(0).toUpperCase() + l.slice(1) + ' —</option>';
    sel.disabled = true;
  });
  if (!id) return;
  const type = document.getElementById('f-type').value;
  if (type === 'DISTRICT') return; // district is what we're adding, no need to load more
  await loadCascadeChildren(id, 'c-district');
}

// District selected → load sectors
async function onCDistrict() {
  const id = document.getElementById('c-district').value;
  ['sector','cell'].forEach(l => {
    const sel = document.getElementById('c-' + l);
    sel.innerHTML = '<option value="">— Select ' + l.charAt(0).toUpperCase() + l.slice(1) + ' —</option>';
    sel.disabled = true;
  });
  if (!id) return;
  const type = document.getElementById('f-type').value;
  if (type === 'SECTOR') return;
  await loadCascadeChildren(id, 'c-sector');
}

// Sector selected → load cells
async function onCSector() {
  const id = document.getElementById('c-sector').value;
  const sel = document.getElementById('c-cell');
  sel.innerHTML = '<option value="">— Select Cell —</option>';
  sel.disabled = true;
  if (!id) return;
  const type = document.getElementById('f-type').value;
  if (type === 'CELL') return;
  await loadCascadeChildren(id, 'c-cell');
}

// Cell selected — nothing more to load (village is what we're adding)
function onCCell() {}

async function loadCascadeChildren(parentId, selectId) {
  const res = await apiFetch('/locations/byParent/' + parentId);
  const sel = document.getElementById(selectId);
  const level = selectId.replace('c-', '');
  if (res.ok && res.data.length) {
    sel.innerHTML = '<option value="">— Select ' + level.charAt(0).toUpperCase() + level.slice(1) + ' —</option>' +
      res.data.map(l => '<option value="' + l.id + '">' + l.name + '</option>').join('');
    sel.disabled = false;
  } else {
    sel.innerHTML = '<option value="">No ' + level + 's found</option>';
    sel.disabled = true;
  }
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ── save new location ──────────────────────────────────────────────────────
async function saveLocation() {
  const type    = document.getElementById('f-type').value;
  const name    = document.getElementById('f-name').value.trim();
  const code    = document.getElementById('f-code').value.trim();
  const alertEl = document.getElementById('alert');

  if (!name) return showAlert(alertEl, 'Name is required', 'error');

  // determine parentId from cascade
  const parentMap = {
    PROVINCE: null,
    DISTRICT: document.getElementById('c-province').value,
    SECTOR:   document.getElementById('c-district').value,
    CELL:     document.getElementById('c-sector').value,
    VILLAGE:  document.getElementById('c-cell').value
  };
  const parentId = parentMap[type];

  if (type !== 'PROVINCE' && !parentId)
    return showAlert(alertEl, 'Please select the full parent hierarchy', 'error');

  const body = { name, type };
  if (code) body.code = code;

  let res;
  if (parentId) {
    body.parentId = parseInt(parentId);
    res = await apiFetch('/locations/saveWithParent', { method:'POST', body:JSON.stringify(body) });
  } else {
    res = await apiFetch('/locations/save', { method:'POST', body:JSON.stringify(body) });
  }

  if (res.ok) {
    showAlert(alertEl, type + ' "' + name + '" added successfully!', 'success');
    closeModal();
    await loadStats();
    // refresh current view
    if (breadcrumbStack.length) {
      const p = breadcrumbStack.at(-1);
      await drillInto(p.id, p.name, p.type);
    } else {
      await loadProvinces();
    }
  } else {
    showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Save failed', 'error');
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  EDIT MODAL
// ══════════════════════════════════════════════════════════════════════════

function openEditModal(id, name, code, type) {
  editingId = id;
  document.getElementById('edit-title').textContent = 'Edit ' + type;
  document.getElementById('e-name').value = name;
  document.getElementById('e-code').value = code;
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingId = null;
}

async function saveEdit() {
  const name    = document.getElementById('e-name').value.trim();
  const code    = document.getElementById('e-code').value.trim();
  const alertEl = document.getElementById('alert');
  if (!name) return showAlert(alertEl, 'Name is required', 'error');

  const res = await apiFetch('/locations/update/' + editingId, {
    method: 'PUT', body: JSON.stringify({ name, code })
  });

  if (res.ok) {
    showAlert(alertEl, 'Location updated!', 'success');
    closeEditModal();
    await loadStats();
    if (breadcrumbStack.length) {
      const p = breadcrumbStack.at(-1);
      await drillInto(p.id, p.name, p.type);
    } else {
      await loadProvinces();
    }
  } else {
    showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Update failed', 'error');
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  DELETE
// ══════════════════════════════════════════════════════════════════════════

async function deleteLocation(id, name, type) {
  if (!confirm('Delete ' + type + ' "' + name + '"?\n\nCannot delete if it has sub-locations.')) return;
  const res = await apiFetch('/locations/delete/' + id, { method:'DELETE' });
  const alertEl = document.getElementById('alert');
  if (res.ok) {
    showAlert(alertEl, type + ' "' + name + '" deleted.', 'success');
    await loadStats();
    if (breadcrumbStack.length) {
      const p = breadcrumbStack.at(-1);
      await drillInto(p.id, p.name, p.type);
    } else {
      await loadProvinces();
    }
  } else {
    showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Delete failed', 'error');
  }
}

init();

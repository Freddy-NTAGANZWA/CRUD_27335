<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Appointments — ServiceBook</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <div class="topbar">
    <h1>My Appointments</h1>
    <div class="topbar-right" id="topbar-user">
      <button class="btn btn-primary" onclick="openModal()">+ Book Appointment</button>
    </div>
  </div>
  <div class="content">
    <div id="alert" class="alert"></div>

    <div class="search-bar">
      <input type="text" id="search" placeholder="Search by service…" oninput="filterTable()"/>
      <select class="form-control" id="filter-status" onchange="filterTable()" style="width:160px;">
        <option value="">All Statuses</option>
        <option value="PENDING">Pending</option>
        <option value="CONFIRMED">Confirmed</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>

    <div class="card">
      <div class="card-header"><h3>My Appointments</h3><span id="total-badge" class="badge">0</span></div>
      <div class="card-body">
        <div id="table-container"><div class="loading"><div class="spinner"></div></div></div>
      </div>
    </div>
  </div>
</main>

<!-- Book Appointment Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Book Appointment</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Select Service *</label>
        <select class="form-control" id="f-service">
          <option value="">— Choose a service —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Appointment Date & Time *</label>
        <input class="form-control" id="f-time" type="datetime-local"/>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea class="form-control" id="f-notes" rows="3" placeholder="Any special requests…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAppointment()">Book</button>
    </div>
  </div>
</div>

<!-- Cancel confirm modal -->
<div class="modal-overlay" id="cancel-modal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header"><h3>Cancel Appointment</h3><button class="modal-close" onclick="closeCancelModal()">×</button></div>
    <div class="modal-body"><p>Are you sure you want to cancel this appointment?</p></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeCancelModal()">No, Keep It</button>
      <button class="btn btn-danger" onclick="confirmCancel()">Yes, Cancel</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth();
  buildSidebar('my-appointments');

  const userId = currentUserId();
  let allAppointments = [], cancelId = null;

  // Auto-open book modal if ?book=1
  if (new URLSearchParams(location.search).get('book') === '1') {
    window.addEventListener('load', () => openModal());
  }

  async function loadAppointments() {
    const res = await apiFetch(`/appointments/user/${userId}`);
    if (!res.ok) { document.getElementById('table-container').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load appointments</p></div>'; return; }
    allAppointments = res.data || [];
    document.getElementById('total-badge').textContent = allAppointments.length;
    renderTable(allAppointments);
  }

  function renderTable(appointments) {
    if (!appointments.length) {
      document.getElementById('table-container').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No appointments yet. <a href="#" onclick="openModal()" style="color:var(--primary)">Book your first one!</a></p></div>';
      return;
    }
    const rows = appointments.map(a => {
      const canCancel = a.status === 'PENDING' || a.status === 'CONFIRMED';
      return `
        <tr>
          <td>${a.id}</td>
          <td>${a.service?.name || '—'}</td>
          <td>${a.specialist?.name || '—'}</td>
          <td>${formatDateTime(a.appointmentTime)}</td>
          <td>${statusBadge(a.status)}</td>
          <td>${a.notes || '—'}</td>
          <td>${canCancel ? `<button class="btn btn-danger btn-sm" onclick="openCancelModal(${a.id})">✕ Cancel</button>` : '—'}</td>
        </tr>`;
    }).join('');
    document.getElementById('table-container').innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>Service</th><th>Specialist</th><th>Date & Time</th><th>Status</th><th>Notes</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    const status = document.getElementById('filter-status').value;
    renderTable(allAppointments.filter(a => {
      const matchText = (a.service?.name||'').toLowerCase().includes(q);
      return matchText && (!status || a.status === status);
    }));
  }

  async function openModal() {
    // Load services into dropdown
    const res = await apiFetch('/services?size=100');
    const select = document.getElementById('f-service');
    select.innerHTML = '<option value="">— Choose a service —</option>';
    if (res.ok) {
      (res.data.content || []).forEach(s => {
        select.innerHTML += `<option value="${s.id}">${s.name}${s.price ? ' — RWF ' + Number(s.price).toLocaleString() : ''}</option>`;
      });
    }
    document.getElementById('f-time').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function saveAppointment() {
    const serviceId = document.getElementById('f-service').value;
    const time      = document.getElementById('f-time').value;
    const notes     = document.getElementById('f-notes').value.trim();
    const alertEl   = document.getElementById('alert');

    if (!serviceId || !time) return showAlert(alertEl, 'Please select a service and date/time', 'error');

    const body = {
      userId: userId,
      serviceId: parseInt(serviceId),
      appointmentTime: new Date(time).toISOString().slice(0,19),
      status: 'PENDING',
      notes
    };

    const res = await apiFetch('/appointments/save', { method: 'POST', body: JSON.stringify(body) });
    if (res.ok) { showAlert(alertEl, 'Appointment booked successfully!', 'success'); closeModal(); loadAppointments(); }
    else showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Booking failed', 'error');
  }

  function openCancelModal(id) { cancelId = id; document.getElementById('cancel-modal').classList.add('open'); }
  function closeCancelModal() { cancelId = null; document.getElementById('cancel-modal').classList.remove('open'); }

  async function confirmCancel() {
    const res = await apiFetch(`/appointments/update/${cancelId}`, {
      method: 'PUT',
      body: JSON.stringify({ status: 'CANCELLED' })
    });
    const alertEl = document.getElementById('alert');
    closeCancelModal();
    if (res.ok) { showAlert(alertEl, 'Appointment cancelled.', 'success'); loadAppointments(); }
    else showAlert(alertEl, 'Failed to cancel appointment', 'error');
  }

  loadAppointments();
</script>
</body>
</html>

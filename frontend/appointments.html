<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointments — ServiceBook Admin</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .action-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn-confirm  { background: #16a34a; color: #fff; }
    .btn-confirm:hover  { background: #15803d; }
    .btn-complete { background: #2563eb; color: #fff; }
    .btn-complete:hover { background: #1d4ed8; }
    .btn-cancel   { background: #dc2626; color: #fff; }
    .btn-cancel:hover   { background: #b91c1c; }

    /* Detail panel slide-in */
    .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 900; }
    .detail-overlay.open { display: block; }
    .detail-panel { position: fixed; top: 0; right: 0; width: 380px; height: 100vh; background: #fff;
      box-shadow: -4px 0 24px rgba(0,0,0,0.15); z-index: 901; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.3s ease; }
    .detail-panel.open { transform: translateX(0); }
    .detail-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .detail-header h3 { font-size: 1rem; font-weight: 700; }
    .detail-body { flex: 1; overflow-y: auto; padding: 24px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--text-light); font-weight: 500; }
    .detail-row .value { font-weight: 600; text-align: right; max-width: 60%; }
    .detail-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .detail-footer .action-row { display: flex; gap: 8px; }
    .detail-footer .btn { flex: 1; justify-content: center; }

    /* Pending highlight */
    tr.row-pending { background: #fffbeb; }
    tr.row-pending:hover { background: #fef3c7; }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <div class="topbar">
    <h1>Appointments</h1>
    <div class="topbar-right" id="topbar-user">
      <button class="btn btn-primary" onclick="openBookModal()">+ Book Appointment</button>
    </div>
  </div>
  <div class="content">
    <div id="alert" class="alert"></div>

    <!-- Status filter tabs -->
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm tab-btn active" onclick="setTab('')">All <span id="cnt-all" class="badge" style="background:rgba(255,255,255,0.3);margin-left:4px;">0</span></button>
      <button class="btn btn-sm tab-btn" style="background:#fef3c7;color:#92400e;" onclick="setTab('PENDING')">⏳ Pending <span id="cnt-pending" class="badge" style="background:rgba(0,0,0,0.1);color:inherit;margin-left:4px;">0</span></button>
      <button class="btn btn-sm tab-btn" style="background:#dcfce7;color:#166534;" onclick="setTab('CONFIRMED')">✅ Confirmed <span id="cnt-confirmed" class="badge" style="background:rgba(0,0,0,0.1);color:inherit;margin-left:4px;">0</span></button>
      <button class="btn btn-sm tab-btn" style="background:#dbeafe;color:#1e40af;" onclick="setTab('COMPLETED')">🏁 Completed <span id="cnt-completed" class="badge" style="background:rgba(0,0,0,0.1);color:inherit;margin-left:4px;">0</span></button>
      <button class="btn btn-sm tab-btn" style="background:#fee2e2;color:#991b1b;" onclick="setTab('CANCELLED')">✕ Cancelled <span id="cnt-cancelled" class="badge" style="background:rgba(0,0,0,0.1);color:inherit;margin-left:4px;">0</span></button>
    </div>

    <div class="search-bar">
      <input type="text" id="search" placeholder="Search by user or service…" oninput="applyFilters()"/>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 id="table-heading">All Appointments</h3>
        <span id="total-badge" class="badge">0</span>
      </div>
      <div class="card-body">
        <div id="table-container"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>

<!-- ── Detail / Action Panel ──────────────────────────────────────────────── -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <h3>Appointment #<span id="dp-id"></span></h3>
    <button class="modal-close" onclick="closeDetail()">×</button>
  </div>
  <div class="detail-body">
    <div class="detail-row"><span class="label">Status</span><span class="value" id="dp-status"></span></div>
    <div class="detail-row"><span class="label">User</span><span class="value" id="dp-user"></span></div>
    <div class="detail-row"><span class="label">Service</span><span class="value" id="dp-service"></span></div>
    <div class="detail-row"><span class="label">Specialist</span><span class="value" id="dp-specialist"></span></div>
    <div class="detail-row"><span class="label">Date & Time</span><span class="value" id="dp-time"></span></div>
    <div class="detail-row"><span class="label">Notes</span><span class="value" id="dp-notes"></span></div>
  </div>
  <div class="detail-footer">
    <div id="dp-actions"></div>
    <button class="btn btn-warning" onclick="openEditFromDetail()">✏️ Edit Appointment</button>
    <button class="btn btn-secondary" onclick="closeDetail()">Close</button>
  </div>
</div>

<!-- ── Assign Specialist Modal ───────────────────────────────────────────── -->
<div class="modal-overlay" id="assign-modal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h3>Confirm & Assign Specialist</h3>
      <button class="modal-close" onclick="closeAssignModal()">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:0.875rem;color:var(--text-light);margin-bottom:16px;">
        Appointment <strong>#<span id="assign-appt-id"></span></strong> —
        <span id="assign-appt-info"></span>
      </p>
      <div class="form-group">
        <label>Assign Specialist (STAFF member)</label>
        <select class="form-control" id="assign-specialist">
          <option value="">— No specialist / assign later —</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea class="form-control" id="assign-notes" rows="2" placeholder="Add a note for this confirmation…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeAssignModal()">Cancel</button>
      <button class="btn btn-confirm" onclick="submitConfirm()">✅ Confirm Appointment</button>
    </div>
  </div>
</div>

<!-- ── Book / Edit Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Book Appointment</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>User ID *</label>
          <input class="form-control" id="f-user" type="number" placeholder="e.g. 1"/>
        </div>
        <div class="form-group">
          <label>Service ID *</label>
          <input class="form-control" id="f-service" type="number" placeholder="e.g. 2"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Assign Specialist</label>
          <select class="form-control" id="f-specialist">
            <option value="">— None —</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="f-status">
            <option value="PENDING">PENDING</option>
            <option value="CONFIRMED">CONFIRMED</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Appointment Date & Time *</label>
        <input class="form-control" id="f-time" type="datetime-local"/>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea class="form-control" id="f-notes" rows="3" placeholder="Any special notes…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAppointment()">Save</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth(true);
  buildSidebar('appointments');

  let allAppointments = [], currentPage = 0, pageSize = 10, editId = null;
  let activeTab = '', detailAppointment = null;
  let staffList = [], confirmingId = null;

  // ── Load staff list once ──────────────────────────────────────────────────
  async function loadStaff() {
    const res = await apiFetch('/users/staff');
    staffList = res.ok ? (res.data || []) : [];
    const opts = '<option value="">— No specialist / assign later —</option>' +
      staffList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    document.getElementById('assign-specialist').innerHTML = opts;
    document.getElementById('f-specialist').innerHTML =
      '<option value="">— None —</option>' +
      staffList.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  }

  // ── Load ──────────────────────────────────────────────────────────────────
  async function loadAppointments(page = 0) {
    currentPage = page;
    const res = await apiFetch(`/appointments?page=${page}&size=${pageSize}&sortBy=appointmentTime&direction=DESC`);
    if (!res.ok) {
      document.getElementById('table-container').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load</p></div>';
      return;
    }
    allAppointments = res.data.content || [];
    document.getElementById('total-badge').textContent = res.data.totalElements || 0;
    updateCounts();
    applyFilters();
    renderPagination(res.data);
  }

  function updateCounts() {
    document.getElementById('cnt-all').textContent       = allAppointments.length;
    document.getElementById('cnt-pending').textContent   = allAppointments.filter(a => a.status === 'PENDING').length;
    document.getElementById('cnt-confirmed').textContent = allAppointments.filter(a => a.status === 'CONFIRMED').length;
    document.getElementById('cnt-completed').textContent = allAppointments.filter(a => a.status === 'COMPLETED').length;
    document.getElementById('cnt-cancelled').textContent = allAppointments.filter(a => a.status === 'CANCELLED').length;
  }

  // ── Tab filter ────────────────────────────────────────────────────────────
  function setTab(status) {
    activeTab = status;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'btn-primary'));
    event.currentTarget.classList.add('active', 'btn-primary');
    const labels = { '': 'All Appointments', PENDING: 'Pending Appointments', CONFIRMED: 'Confirmed Appointments', COMPLETED: 'Completed Appointments', CANCELLED: 'Cancelled Appointments' };
    document.getElementById('table-heading').textContent = labels[status];
    applyFilters();
  }

  function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = allAppointments.filter(a => {
      const matchTab  = !activeTab || a.status === activeTab;
      const matchText = (a.user?.name || '').toLowerCase().includes(q) || (a.service?.name || '').toLowerCase().includes(q);
      return matchTab && matchText;
    });
    renderTable(filtered);
  }

  // ── Render table ──────────────────────────────────────────────────────────
  function renderTable(appointments) {
    if (!appointments.length) {
      document.getElementById('table-container').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No appointments found</p></div>';
      return;
    }

    const rows = appointments.map(a => {
      const actionBtns = buildActionBtns(a);
      return `
        <tr class="${a.status === 'PENDING' ? 'row-pending' : ''}">
          <td><strong>#${a.id}</strong></td>
          <td>${a.user?.name || '—'}</td>
          <td>${a.service?.name || '—'}</td>
          <td>${a.specialist?.name || '—'}</td>
          <td>${formatDateTime(a.appointmentTime)}</td>
          <td>${statusBadge(a.status)}</td>
          <td>
            <div class="action-btns">
              ${actionBtns}
              <button class="btn btn-secondary btn-sm" onclick="openDetail(${a.id})" title="View details">👁️</button>
              <button class="btn btn-warning btn-sm"   onclick="editAppointment(${a.id})" title="Edit">✏️</button>
              <button class="btn btn-danger btn-sm"    onclick="deleteAppointment(${a.id})" title="Delete">🗑️</button>
            </div>
          </td>
        </tr>`;
    }).join('');

    document.getElementById('table-container').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th><th>User</th><th>Service</th><th>Specialist</th>
            <th>Date & Time</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // Build the correct quick-action buttons based on current status
  function buildActionBtns(a) {
    switch (a.status) {
      case 'PENDING':
        return `
          <button class="btn btn-confirm btn-sm" onclick="openAssignModal(${a.id})" title="Confirm and assign specialist">✅ Confirm</button>
          <button class="btn btn-cancel  btn-sm" onclick="quickStatus(${a.id},'CANCELLED')" title="Cancel this appointment">✕ Cancel</button>`;
      case 'CONFIRMED':
        return `
          <button class="btn btn-complete btn-sm" onclick="quickStatus(${a.id},'COMPLETED')" title="Mark as completed">🏁 Complete</button>
          <button class="btn btn-cancel   btn-sm" onclick="quickStatus(${a.id},'CANCELLED')" title="Cancel this appointment">✕ Cancel</button>`;
      case 'COMPLETED':
        return `<span style="font-size:0.78rem;color:var(--text-light);">No actions</span>`;
      case 'CANCELLED':
        return `
          <button class="btn btn-confirm btn-sm" onclick="quickStatus(${a.id},'PENDING')" title="Re-open as pending">↩ Re-open</button>`;
      default:
        return '';
    }
  }

  // ── Assign Specialist modal ───────────────────────────────────────────────
  async function openAssignModal(id) {
    confirmingId = id;
    const appt = allAppointments.find(a => a.id === id);
    document.getElementById('assign-appt-id').textContent   = id;
    document.getElementById('assign-appt-info').textContent =
      `${appt?.user?.name || '?'} → ${appt?.service?.name || '?'} on ${formatDateTime(appt?.appointmentTime)}`;
    // Pre-select existing specialist if any
    const sel = document.getElementById('assign-specialist');
    sel.value = appt?.specialist?.id || '';
    document.getElementById('assign-notes').value = appt?.notes || '';
    document.getElementById('assign-modal').classList.add('open');
  }

  function closeAssignModal() {
    document.getElementById('assign-modal').classList.remove('open');
    confirmingId = null;
  }

  async function submitConfirm() {
    const specialistId = document.getElementById('assign-specialist').value;
    const notes        = document.getElementById('assign-notes').value.trim();
    const alertEl      = document.getElementById('alert');

    const body = { status: 'CONFIRMED', notes };
    if (specialistId) body.specialistId = parseInt(specialistId);

    const res = await apiFetch(`/appointments/update/${confirmingId}`, {
      method: 'PUT',
      body: JSON.stringify(body)
    });

    closeAssignModal();
    if (res.ok) {
      const specialist = staffList.find(s => s.id === parseInt(specialistId));
      const msg = specialist
        ? `✅ Appointment confirmed and assigned to ${specialist.name}!`
        : '✅ Appointment confirmed!';
      showAlert(alertEl, msg, 'success');
      loadAppointments(currentPage);
    } else {
      showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Confirm failed', 'error');
    }
  }

  // ── Quick status change (the main admin action) ───────────────────────────
  async function quickStatus(id, newStatus) {
    const labels = { CONFIRMED: 'Confirm', COMPLETED: 'Complete', CANCELLED: 'Cancel', PENDING: 'Re-open' };
    if (!confirm(`${labels[newStatus]} appointment #${id}?`)) return;

    const res = await apiFetch(`/appointments/update/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ status: newStatus })
    });

    const alertEl = document.getElementById('alert');
    if (res.ok) {
      const msgs = { CONFIRMED: '✅ Appointment confirmed!', COMPLETED: '🏁 Appointment marked as completed!', CANCELLED: '✕ Appointment cancelled.', PENDING: '↩ Appointment re-opened.' };
      showAlert(alertEl, msgs[newStatus], 'success');
      // If detail panel is open for this appointment, refresh it
      if (detailAppointment?.id === id) {
        detailAppointment.status = newStatus;
        renderDetailPanel(detailAppointment);
      }
      loadAppointments(currentPage);
    } else {
      showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Action failed', 'error');
    }
  }

  // ── Detail panel ──────────────────────────────────────────────────────────
  async function openDetail(id) {
    const res = await apiFetch(`/appointments/${id}`);
    if (!res.ok) return;
    detailAppointment = res.data;
    renderDetailPanel(detailAppointment);
    document.getElementById('detail-overlay').classList.add('open');
    document.getElementById('detail-panel').classList.add('open');
  }

  function renderDetailPanel(a) {
    document.getElementById('dp-id').textContent         = a.id;
    document.getElementById('dp-status').innerHTML       = statusBadge(a.status);
    document.getElementById('dp-user').textContent       = a.user?.name || '—';
    document.getElementById('dp-service').textContent    = a.service?.name || '—';
    document.getElementById('dp-specialist').textContent = a.specialist?.name || '—';
    document.getElementById('dp-time').textContent       = formatDateTime(a.appointmentTime);
    document.getElementById('dp-notes').textContent      = a.notes || '—';

    // Action buttons inside detail panel
    let actions = '';
    switch (a.status) {
      case 'PENDING':
        actions = `
          <div class="action-row">
            <button class="btn btn-confirm" onclick="closeDetail();openAssignModal(${a.id})">✅ Confirm & Assign Specialist</button>
            <button class="btn btn-cancel"  onclick="quickStatus(${a.id},'CANCELLED')">✕ Cancel</button>
          </div>`;
        break;
      case 'CONFIRMED':
        actions = `
          <div class="action-row">
            <button class="btn btn-complete" onclick="quickStatus(${a.id},'COMPLETED')">🏁 Mark as Completed</button>
            <button class="btn btn-cancel"   onclick="quickStatus(${a.id},'CANCELLED')">✕ Cancel</button>
          </div>`;
        break;
      case 'CANCELLED':
        actions = `<button class="btn btn-confirm" style="width:100%;" onclick="quickStatus(${a.id},'PENDING')">↩ Re-open as Pending</button>`;
        break;
      case 'COMPLETED':
        actions = `<p style="font-size:0.85rem;color:var(--text-light);text-align:center;">This appointment is completed.</p>`;
        break;
    }
    document.getElementById('dp-actions').innerHTML = actions;
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
    document.getElementById('detail-panel').classList.remove('open');
    detailAppointment = null;
  }

  function openEditFromDetail() {
    closeDetail();
    if (detailAppointment) editAppointment(detailAppointment.id);
  }

  // ── Pagination ────────────────────────────────────────────────────────────
  function renderPagination(data) {
    const pg = document.getElementById('pagination');
    if (data.totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="loadAppointments(${currentPage-1})" ${currentPage===0?'disabled':''}>‹ Prev</button>`;
    for (let i = 0; i < data.totalPages; i++)
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="loadAppointments(${i})">${i+1}</button>`;
    html += `<button class="page-btn" onclick="loadAppointments(${currentPage+1})" ${currentPage===data.totalPages-1?'disabled':''}>Next ›</button>`;
    html += `<span class="page-info">Page ${currentPage+1} of ${data.totalPages}</span>`;
    pg.innerHTML = html;
  }

  // ── Book / Edit modal ─────────────────────────────────────────────────────
  function openBookModal() {
    editId = null;
    document.getElementById('modal-title').textContent = 'Book Appointment';
    ['f-user','f-service','f-specialist','f-notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = 'PENDING';
    document.getElementById('f-time').value = '';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function editAppointment(id) {
    const res = await apiFetch(`/appointments/${id}`);
    if (!res.ok) return;
    const a = res.data;
    editId = id;
    document.getElementById('modal-title').textContent    = 'Edit Appointment';
    document.getElementById('f-user').value               = a.user?.id || '';
    document.getElementById('f-service').value            = a.service?.id || '';
    document.getElementById('f-specialist').value         = a.specialist?.id || '';
    document.getElementById('f-status').value             = a.status || 'PENDING';
    document.getElementById('f-notes').value              = a.notes || '';
    if (a.appointmentTime)
      document.getElementById('f-time').value = new Date(a.appointmentTime).toISOString().slice(0,16);
    document.getElementById('modal').classList.add('open');
  }

  async function saveAppointment() {
    const userId       = document.getElementById('f-user').value;
    const serviceId    = document.getElementById('f-service').value;
    const specialistId = document.getElementById('f-specialist').value;
    const status       = document.getElementById('f-status').value;
    const time         = document.getElementById('f-time').value;
    const notes        = document.getElementById('f-notes').value.trim();
    const alertEl      = document.getElementById('alert');

    if (!editId && (!userId || !serviceId || !time))
      return showAlert(alertEl, 'User ID, Service ID and time are required', 'error');

    const body = { status, notes };
    if (userId)       body.userId       = parseInt(userId);
    if (serviceId)    body.serviceId    = parseInt(serviceId);
    if (specialistId) body.specialistId = parseInt(specialistId);
    if (time)         body.appointmentTime = new Date(time).toISOString().slice(0,19);

    const res = editId
      ? await apiFetch(`/appointments/update/${editId}`, { method: 'PUT', body: JSON.stringify(body) })
      : await apiFetch('/appointments/save', { method: 'POST', body: JSON.stringify(body) });

    if (res.ok) {
      showAlert(alertEl, editId ? 'Appointment updated!' : 'Appointment booked!', 'success');
      closeModal();
      loadAppointments(currentPage);
    } else {
      showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Operation failed', 'error');
    }
  }

  async function deleteAppointment(id) {
    if (!confirm(`Delete appointment #${id}? This cannot be undone.`)) return;
    const res = await apiFetch(`/appointments/delete/${id}`, { method: 'DELETE' });
    const alertEl = document.getElementById('alert');
    if (res.ok) { showAlert(alertEl, 'Appointment deleted!', 'success'); loadAppointments(currentPage); }
    else showAlert(alertEl, 'Failed to delete', 'error');
  }

  loadStaff();
  loadAppointments();
</script>
</body>
</html>

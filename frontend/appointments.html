<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointments — ServiceBook Admin</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <div class="topbar">
    <h1>Appointments</h1>
    <div class="topbar-right" id="topbar-user">
      <button class="btn btn-primary" onclick="openModal()">+ Book Appointment</button>
    </div>
  </div>
  <div class="content">
    <div id="alert" class="alert"></div>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search by user or service…" oninput="filterTable()"/>
      <select class="form-control" id="filter-status" onchange="filterTable()" style="width:160px;">
        <option value="">All Statuses</option>
        <option value="PENDING">Pending</option>
        <option value="CONFIRMED">Confirmed</option>
        <option value="COMPLETED">Completed</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>
    <div class="card">
      <div class="card-header"><h3>All Appointments</h3><span id="total-badge" class="badge">0</span></div>
      <div class="card-body">
        <div id="table-container"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Book Appointment</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>User ID *</label>
          <input class="form-control" id="f-user" type="number" placeholder="e.g. 1"/>
        </div>
        <div class="form-group">
          <label>Service ID *</label>
          <input class="form-control" id="f-service" type="number" placeholder="e.g. 2"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Specialist ID (optional)</label>
          <input class="form-control" id="f-specialist" type="number" placeholder="e.g. 3"/>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="form-control" id="f-status">
            <option value="PENDING">PENDING</option>
            <option value="CONFIRMED">CONFIRMED</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Appointment Date & Time *</label>
        <input class="form-control" id="f-time" type="datetime-local"/>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea class="form-control" id="f-notes" rows="3" placeholder="Any special notes…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAppointment()">Save</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  requireAuth(true);
  buildSidebar('appointments');

  let allAppointments = [], currentPage = 0, pageSize = 10, editId = null;

  async function loadAppointments(page = 0) {
    currentPage = page;
    const res = await apiFetch(`/appointments?page=${page}&size=${pageSize}&sortBy=appointmentTime&direction=DESC`);
    if (!res.ok) { document.getElementById('table-container').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load</p></div>'; return; }
    allAppointments = res.data.content || [];
    document.getElementById('total-badge').textContent = res.data.totalElements || 0;
    renderTable(allAppointments);
    renderPagination(res.data);
  }

  function renderTable(appointments) {
    if (!appointments.length) { document.getElementById('table-container').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>No appointments found</p></div>'; return; }
    const rows = appointments.map(a => `
      <tr>
        <td>${a.id}</td>
        <td>${a.user?.name || '—'}</td>
        <td>${a.service?.name || '—'}</td>
        <td>${a.specialist?.name || '—'}</td>
        <td>${formatDateTime(a.appointmentTime)}</td>
        <td>${statusBadge(a.status)}</td>
        <td>${a.notes || '—'}</td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="editAppointment(${a.id})">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteAppointment(${a.id})">🗑️ Delete</button>
        </td>
      </tr>`).join('');
    document.getElementById('table-container').innerHTML = `
      <table>
        <thead><tr><th>ID</th><th>User</th><th>Service</th><th>Specialist</th><th>Date & Time</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderPagination(data) {
    const pg = document.getElementById('pagination');
    if (data.totalPages <= 1) { pg.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="loadAppointments(${currentPage-1})" ${currentPage===0?'disabled':''}>‹ Prev</button>`;
    for (let i = 0; i < data.totalPages; i++)
      html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="loadAppointments(${i})">${i+1}</button>`;
    html += `<button class="page-btn" onclick="loadAppointments(${currentPage+1})" ${currentPage===data.totalPages-1?'disabled':''}>Next ›</button>`;
    html += `<span class="page-info">Page ${currentPage+1} of ${data.totalPages}</span>`;
    pg.innerHTML = html;
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    const status = document.getElementById('filter-status').value;
    renderTable(allAppointments.filter(a => {
      const matchText = (a.user?.name||'').toLowerCase().includes(q) || (a.service?.name||'').toLowerCase().includes(q);
      return matchText && (!status || a.status === status);
    }));
  }

  function openModal() {
    editId = null;
    document.getElementById('modal-title').textContent = 'Book Appointment';
    ['f-user','f-service','f-specialist','f-notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = 'PENDING';
    document.getElementById('f-time').value = '';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function editAppointment(id) {
    const res = await apiFetch(`/appointments/${id}`);
    if (!res.ok) return;
    const a = res.data;
    editId = id;
    document.getElementById('modal-title').textContent = 'Edit Appointment';
    document.getElementById('f-user').value       = a.user?.id || '';
    document.getElementById('f-service').value    = a.service?.id || '';
    document.getElementById('f-specialist').value = a.specialist?.id || '';
    document.getElementById('f-status').value     = a.status || 'PENDING';
    document.getElementById('f-notes').value      = a.notes || '';
    if (a.appointmentTime) document.getElementById('f-time').value = new Date(a.appointmentTime).toISOString().slice(0,16);
    document.getElementById('modal').classList.add('open');
  }

  async function saveAppointment() {
    const userId      = document.getElementById('f-user').value;
    const serviceId   = document.getElementById('f-service').value;
    const specialistId= document.getElementById('f-specialist').value;
    const status      = document.getElementById('f-status').value;
    const time        = document.getElementById('f-time').value;
    const notes       = document.getElementById('f-notes').value.trim();
    const alertEl     = document.getElementById('alert');

    if (!editId && (!userId || !serviceId || !time)) return showAlert(alertEl, 'User ID, Service ID and time are required', 'error');

    const body = { status, notes };
    if (userId)       body.userId       = parseInt(userId);
    if (serviceId)    body.serviceId    = parseInt(serviceId);
    if (specialistId) body.specialistId = parseInt(specialistId);
    if (time)         body.appointmentTime = new Date(time).toISOString().slice(0,19);

    const res = editId
      ? await apiFetch(`/appointments/update/${editId}`, { method: 'PUT', body: JSON.stringify(body) })
      : await apiFetch('/appointments/save', { method: 'POST', body: JSON.stringify(body) });

    if (res.ok) { showAlert(alertEl, editId ? 'Appointment updated!' : 'Appointment booked!', 'success'); closeModal(); loadAppointments(currentPage); }
    else showAlert(alertEl, typeof res.data === 'string' ? res.data : 'Operation failed', 'error');
  }

  async function deleteAppointment(id) {
    if (!confirm('Delete this appointment?')) return;
    const res = await apiFetch(`/appointments/delete/${id}`, { method: 'DELETE' });
    const alertEl = document.getElementById('alert');
    if (res.ok) { showAlert(alertEl, 'Appointment deleted!', 'success'); loadAppointments(currentPage); }
    else showAlert(alertEl, 'Failed to delete', 'error');
  }

  loadAppointments();
</script>
</body>
</html>

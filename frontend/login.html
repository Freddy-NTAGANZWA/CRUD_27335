<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ServiceBook</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-logo">
    <h1>📅 ServiceBook</h1>
    <p>Service Appointment System</p>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab active" onclick="switchTab('login')">Sign In</div>
    <div class="auth-tab" onclick="switchTab('register')">Register</div>
  </div>

  <div id="alert" class="alert"></div>

  <!-- LOGIN FORM -->
  <div class="auth-form active" id="form-login">
    <div class="form-group">
      <label>Email Address</label>
      <input class="form-control" id="l-email" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input class="form-control" id="l-password" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doLogin()">Sign In</button>

    <div class="demo-creds">
      <strong>Demo Credentials</strong>
      Admin → admin@servicebook.rw / admin123<br/>
    </div>
  </div>

  <!-- REGISTER FORM -->
  <div class="auth-form" id="form-register">
    <div class="form-row">
      <div class="form-group">
        <label>Full Name *</label>
        <input class="form-control" id="r-name" placeholder="John Doe"/>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input class="form-control" id="r-email" type="email" placeholder="you@example.com"/>
      </div>
    </div>
    <div class="form-group">
      <label>Password *</label>
      <input class="form-control" id="r-password" type="password" placeholder="Min 6 characters"/>
    </div>
    <div class="form-group">
      <label>Confirm Password *</label>
      <input class="form-control" id="r-confirm" type="password" placeholder="Repeat password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="doRegister()">Create Account</button>
    <p class="auth-footer">Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // If already logged in, redirect
  if (isLoggedIn()) {
    window.location.href = isAdmin() ? 'index.html' : 'user-dashboard.html';
  }

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
    document.getElementById('form-login').classList.toggle('active', tab === 'login');
    document.getElementById('form-register').classList.toggle('active', tab === 'register');
    document.getElementById('alert').classList.remove('show');
  }

  async function doLogin() {
    const email    = document.getElementById('l-email').value.trim();
    const password = document.getElementById('l-password').value;
    const alert    = document.getElementById('alert');

    if (!email || !password) return showAlert(alert, 'Email and password are required', 'error');

    const res = await apiFetch('/users/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });

    if (res.ok) {
      saveSession(res.data);
      window.location.href = isAdmin() ? 'index.html' : 'user-dashboard.html';
    } else {
      showAlert(alert, typeof res.data === 'string' ? res.data : 'Invalid credentials', 'error');
    }
  }

  async function doRegister() {
    const name     = document.getElementById('r-name').value.trim();
    const email    = document.getElementById('r-email').value.trim();
    const password = document.getElementById('r-password').value;
    const confirm  = document.getElementById('r-confirm').value;
    const alert    = document.getElementById('alert');

    if (!name || !email || !password) return showAlert(alert, 'All fields are required', 'error');
    if (password.length < 6) return showAlert(alert, 'Password must be at least 6 characters', 'error');
    if (password !== confirm) return showAlert(alert, 'Passwords do not match', 'error');

    const res = await apiFetch('/users/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password })
    });

    if (res.ok) {
      showAlert(alert, 'Account created! Please sign in.', 'success');
      document.getElementById('r-name').value = '';
      document.getElementById('r-email').value = '';
      document.getElementById('r-password').value = '';
      document.getElementById('r-confirm').value = '';
      setTimeout(() => switchTab('login'), 1500);
    } else {
      showAlert(alert, typeof res.data === 'string' ? res.data : 'Registration failed', 'error');
    }
  }

  // Allow Enter key on login form
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginActive = document.getElementById('form-login').classList.contains('active');
      if (loginActive) doLogin();
    }
  });
</script>
</body>
</html>
